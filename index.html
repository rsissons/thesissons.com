<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sissons · Projects</title>
  <meta name="description" content="Free family games that run right in your browser: golf on two real local courses, a football game, retro arcade classics, and no-reading games for little kids.">
  <meta property="og:title" content="The Sissons · Projects">
  <meta property="og:description" content="Free web apps and games that run right in your browser.">
  <meta property="og:image" content="img/san-dimas-golf.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b5cad'/%3E%3Ctext x='32' y='43' font-family='Arial,sans-serif' font-size='30' font-weight='700' text-anchor='middle' fill='white'%3ES%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f6f7f9; --surface: #ffffff; --text: #16202c; --muted: #5b6776; --line: #e3e7ec;
      --accent: #0b5cad; --accent-soft: #e6f0fa; --chip: #eef1f4; --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 16px rgba(16, 24, 40, .06);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f141a; --surface: #171e26; --text: #e8edf2; --muted: #9aa7b4; --line: #26303b;
        --accent: #5aa7f0; --accent-soft: #15283b; --chip: #212a34; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    a { color: var(--accent); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

    header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
    header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 64px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -.01em; color: var(--text); text-decoration: none; }
    .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 17px; }
    nav.cats { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
    nav.cats a { text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 8px; }
    nav.cats a:hover { background: var(--chip); color: var(--text); }

    .hero { padding: 48px 0 20px; }
    .hero h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; }
    .hero p { color: var(--muted); font-size: 18px; max-width: 640px; margin: 0; }

    section.cat { padding: 28px 0 8px; scroll-margin-top: 16px; }
    section.cat > h2 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
    section.cat > p { color: var(--muted); margin: 0 0 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 22px; }

    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; }
    .card .shot { display: block; aspect-ratio: 16 / 10; background: var(--chip); border-bottom: 1px solid var(--line); overflow: hidden; }
    .card .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; transition: transform .25s ease; }
    .card .shot:hover img { transform: scale(1.02); }
    .card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card h3 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
    .card p { margin: 0; color: var(--muted); font-size: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tags span { font-size: 12px; font-weight: 600; background: var(--chip); color: var(--muted); padding: 2px 8px; border-radius: 99px; }
    .actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 9px; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.ghost { color: var(--text); border: 1px solid var(--line); }
    .btn.ghost:hover { background: var(--chip); }


    footer { margin-top: 48px; border-top: 1px solid var(--line); background: var(--surface); }
    footer .wrap { padding: 22px 16px; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; gap: 8px 20px; justify-content: space-between; }

    @media (max-width: 560px) {
      nav.cats { display: none; }
      .hero { padding-top: 32px; }
      .hero p { font-size: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./"><span class="mark">S</span>The Sissons</a>
      <nav class="cats" id="nav" aria-label="Project categories"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="hero">
      <h1>Family games</h1>
      <p>Free games that run right in your browser. No sign-up or install, and their source is on GitHub.</p>
    </div>
    <div id="projects"></div>
  </main>

  <footer>
    <div class="wrap">
      <span>Ron Sissons · thesissons.com</span>
      <span>All projects on <a href="https://github.com/rsissons">GitHub</a></span>
    </div>
  </footer>

  <script>
    // Categories come from GitHub repo topics. A repo shows up here only if it has one of these topics;
    // the first match in this order wins (so a kids' game goes under "For the kids").
    // Family site only: business products (anything tagged business, retirement planning or cooking) are never listed here.
    const CATEGORIES = [
      { topic: 'kids', id: 'kids', title: 'For the kids', blurb: 'Made for my grandkids. No reading needed.' },
      { topic: 'game', id: 'games', title: 'Games', blurb: 'Sports and arcade games you can play on a phone, tablet or computer.' },
    ];
    const EXCLUDED_TOPICS = new Set(['business', 'retirement-planning', 'cooking']);
    const TITLES = {
      'san-dimas-golf': 'Canyon Golf',
      'gridiron-qb': 'Gridiron QB',
      'dolly-dress-up': 'Dolly Dress-Up',
      'unicorn-stable': 'Unicorn Stable',
      'retro-arcade': 'Retro Arcade',
    };
    const IMAGES = {
      'san-dimas-golf': 'img/san-dimas-golf.webp',
      'gridiron-qb': 'img/gridiron-qb.webp',
      'dolly-dress-up': 'img/dolly-dress-up.webp',
      'unicorn-stable': 'img/unicorn-stable.webp',
      'retro-arcade': 'img/retro-arcade.webp',
    };
    const HIDDEN_TOPICS = new Set(['game', 'kids']);
    // Shown if GitHub can't be reached (and replaced by the live list when it can)
    const FALLBACK = [
      { name: 'san-dimas-golf', description: 'Canyon Golf: a daily golf game on the real San Dimas Canyon and Marshall Canyon courses. Type a name and play.', homepage: 'https://rsissons.github.io/san-dimas-golf/', topics: ['game', 'golf'], pushed_at: '2026-09-24' },
      { name: 'gridiron-qb', description: '3D pull-back quarterback game: playbook routes, field goals, target toss, four stadiums', homepage: 'https://rsissons.github.io/gridiron-qb/', topics: ['game', 'football'], pushed_at: '2026-09-25' },
      { name: 'dolly-dress-up', description: 'A no-reading dress-up, makeup and hygiene game for little kids', homepage: 'https://rsissons.github.io/dolly-dress-up/', topics: ['kids', 'game'], pushed_at: '2026-09-24' },
      { name: 'unicorn-stable', description: 'A no-reading unicorn game for little kids: build it, care for it, fly it.', homepage: 'https://rsissons.github.io/unicorn-stable/', topics: ['kids', 'game', 'unicorn'], pushed_at: '2026-09-26' },
      { name: 'retro-arcade', description: 'Ten 80s arcade classics in the browser: tributes to Asteroids, Galaga, Pac-Man, Joust, Defender and more, plus the real Zork I', homepage: 'https://rsissons.github.io/retro-arcade/', topics: ['game', 'arcade', 'retro'], pushed_at: '2026-09-29' },
    ];

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const titleOf = r => TITLES[r.name] ?? r.name.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const safeUrl = u => /^https:\/\//.test(u ?? '') ? u : '';

    function card(r) {
      const url = safeUrl(r.homepage);
      const code = r.cta ? '' : `https://github.com/rsissons/${encodeURIComponent(r.name)}`;
      const img = IMAGES[r.name] ?? `https://opengraph.githubassets.com/1/rsissons/${encodeURIComponent(r.name)}`;
      const tags = (r.topics ?? []).filter(t => !HIDDEN_TOPICS.has(t)).map(t => `<span>${esc(t)}</span>`).join('');
      const title = esc(titleOf(r));
      const shot = `<img src="${esc(img)}" alt="Screenshot of ${title}" loading="lazy" width="800" height="500">`;
      return `<article class="card">
        ${r.cta ? `<div class="shot">${shot}</div>` : `<a class="shot" href="${esc(url || code)}" aria-label="Open ${title}">${shot}</a>`}
        <div class="body">
          <h3>${title}</h3>
          <p>${esc(r.description)}</p>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          <div class="actions">
            ${r.cta ? `<a class="btn primary" href="${esc(r.cta.href)}">${esc(r.cta.label)}</a>` : ''}
            ${url ? `<a class="btn primary" href="${esc(url)}">Open</a>` : ''}
            ${code ? `<a class="btn ghost" href="${esc(code)}">Source</a>` : ''}
          </div>
        </div>
      </article>`;
    }

    function render(repos) {
      const byCat = CATEGORIES.map(c => ({ ...c, repos: [] }));
      for (const r of repos) {
        if ((r.topics ?? []).some(t => EXCLUDED_TOPICS.has(t))) continue;
        const cat = byCat.find(c => (r.topics ?? []).includes(c.topic));
        if (cat) cat.repos.push(r);
      }
      const shown = byCat.filter(c => c.repos.length);
      for (const c of shown) c.repos.sort((a, b) => String(b.pushed_at).localeCompare(String(a.pushed_at)));
      document.getElementById('nav').innerHTML = shown.map(c => `<a href="#${c.id}">${esc(c.title)}</a>`).join('');
      document.getElementById('projects').innerHTML = shown.map(c => `
        <section class="cat" id="${c.id}">
          <h2>${esc(c.title)}</h2>
          <p>${esc(c.blurb)}</p>
          <div class="grid">${c.repos.map(card).join('')}</div>
        </section>`).join('');
    }

    render(FALLBACK);
    // Live list: public, non-fork repos with a category topic
    fetch('https://api.github.com/users/rsissons/repos?per_page=100&sort=pushed')
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(list => {
        const repos = list.filter(r => !r.fork && !r.private && !r.archived);
        if (repos.some(r => CATEGORIES.some(c => (r.topics ?? []).includes(c.topic)))) render(repos);
      })
      .catch(() => { /* keep the built-in list */ });
  </script>
</body>
</html>
